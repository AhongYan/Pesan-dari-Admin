<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesan dari Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> 
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  />
</head>
<body style="background-image: url(https://images.unsplash.com/photo-1688892561884-fb6f8a50b46c?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D);" class="flex justify-center h-screen items-center">
   
    <div class="bg-white border px-10 py-8 border-4 border-gray-300 shadow-lg shadow-blue-300 rounded-xl text-center animate__animated animate__backInDown m-8 w-80" id="kartu">
        <h1 class="text-2xl text-red-500 font-bold animate__animated animate__pulse animate__infinite">Pesan dari MIMIN</h1>
        <button class="p-2 bg-blue-600 text-white rounded mt-5 hover:bg-blue-900 transition ease-in w-full animate__animated animate__delay-1s animate__tada" onclick="ubahKartu()">Klik disini!</button>
    </div>
   
    <script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@3.0.3/tsparticles.confetti.bundle.min.js"></script>
    <script>confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 },
      });
      let kartu = document.getElementById('kartu')
      function ubahKartu() {
        kartu.innerHTML = ` <h1 class="font-semibold text-wrap animate__animated animate__zoomIn">Maaf Bapak/Ibu, untuk video YouTube masih dalam proses, mohon ditunggu ya. Di cek secara berkala link YouTubenya di Galeri Gemawang. Apabila sudah tersedia, laman ini akan otomatis beralih ke Channel YouTube Korwilcam Gemawang. Terimakasih</h1>
        <h2 class="mt-3 animate__animated animate__fadeIn">- Admin Galeri Gemawang -</h2>
        <button class="p-2 bg-slate-600 text-white rounded mt-5 hover:bg-slate-900 transition ease-in w-full animate__animated animate__delay-1s animate__tada" onclick="refresh()">Tutup!</button>
        `

      
        }
        function refresh() {
        location.reload();
        }
      </script>
</body>
</html>
